name: Backend checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run mypy nightwatch
      - run: uv run pytest tests tests/backend
      - run: |
          db_path=$(mktemp /tmp/nightwatch-migration-XXXXXX.db)
          NW_DATABASE_URL="sqlite+aiosqlite:///$db_path" uv run alembic upgrade head
          test -s "$db_path"
      - run: |
          NW_CORS_ORIGINS=https://frontend.example.test \
          NW_WEBSOCKET_ORIGINS=https://frontend.example.test \
          NW_FRONTEND_TOKEN=abcdefghijklmnopqrstuvwxyz123456 \
          NW_OPERATOR_TOKEN=abcdefghijklmnopqrstuvwxyz654321 \
          docker compose -f compose.production.yml config
      - run: docker build --tag nightwatch-backend:test .
