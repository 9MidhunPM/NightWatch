services:
  nightwatch-backend:
    build:
      context: .
    environment:
      NW_ENVIRONMENT: production
      NW_DATABASE_URL: sqlite+aiosqlite:////var/lib/nightwatch/nightwatch.db
      NW_CORS_ORIGINS: ${NW_CORS_ORIGINS:?set an exact HTTPS frontend origin}
      NW_WEBSOCKET_ORIGINS: ${NW_WEBSOCKET_ORIGINS:?set an exact HTTPS frontend origin}
      NW_FRONTEND_TOKEN: ${NW_FRONTEND_TOKEN:?set a 32-character frontend token}
      NW_OPERATOR_TOKEN: ${NW_OPERATOR_TOKEN:?set a 32-character operator token}
    volumes:
      - nightwatch_backend_data:/var/lib/nightwatch
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

volumes:
  nightwatch_backend_data:
    name: nightwatch-backend-data
