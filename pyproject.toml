[project]
name = "nightwatch"
version = "0.1.0"
description = "NightWatch backend control plane"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "aiosqlite>=0.21,<1",
  "docker>=7.1,<8",
  "fastapi>=0.116,<0.117",
  "httpx>=0.28,<1",
  "openai>=2.0,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.35,<0.36",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-docker>=7.1,<8",
  "types-PyYAML>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nightwatch"]

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
